<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rex Fault-Tolerant Quantum Error Correction Lab</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 p-4 sm:p-8 min-h-screen flex justify-center items-center font-sans">
  <div id="root" class="w-full max-w-5xl"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function FanoPlaneVisualizer({ manualErrors, toggleError }) {
      const nodes = [
        { id: 0, label: "Q0", x: 100, y: 20 },
        { id: 1, label: "Q1", x: 20, y: 160 },
        { id: 2, label: "Q2", x: 180, y: 160 },
        { id: 3, label: "Q3", x: 60, y: 90 },
        { id: 4, label: "Q4", x: 140, y: 90 },
        { id: 5, label: "Q5", x: 100, y: 160 },
        { id: 6, label: "Q6", x: 100, y: 110 }
      ];

      return (
        <div className="flex flex-col items-center bg-gray-950 p-4 rounded-xl border border-gray-800">
          <span className="text-[10px] font-mono text-cyan-400 mb-2 uppercase tracking-wider">
            Fano Plane (Click Qubit to Inject Error)
          </span>
          <svg viewBox="0 0 200 180" className="w-48 h-44 overflow-visible">
            <polygon points="100,20 20,160 180,160" fill="none" stroke="#374151" strokeWidth="2" />
            <line x1="100" y1="20" x2="100" y2="160" stroke="#374151" strokeWidth="1.5" strokeDasharray="3,3" />
            <line x1="20" y1="160" x2="140" y2="90" stroke="#374151" strokeWidth="1.5" strokeDasharray="3,3" />
            <line x1="180" y1="160" x2="60" y2="90" stroke="#374151" strokeWidth="1.5" strokeDasharray="3,3" />
            <circle cx="100" cy="113" r="46" fill="none" stroke="#1e293b" strokeWidth="2" />

            {nodes.map((node) => {
              const hasError = manualErrors.includes(node.id);
              return (
                <g key={node.id} onClick={() => toggleError(node.id)} className="cursor-pointer">
                  <circle
                    cx={node.x}
                    cy={node.y}
                    r="14"
                    fill={hasError ? "#ef4444" : "#0f172a"}
                    stroke={hasError ? "#f87171" : "#06b6d4"}
                    strokeWidth="2"
                    className="transition-all duration-200 hover:scale-110"
                  />
                  <text
                    x={node.x}
                    y={node.y + 4}
                    textAnchor="middle"
                    fill={hasError ? "#ffffff" : "#a5f3fc"}
                    fontSize="10"
                    fontFamily="monospace"
                    fontWeight="bold"
                    className="select-none pointer-events-none"
                  >
                    {node.label}
                  </text>
                </g>
              );
            })}
          </svg>
          <span className="text-[9px] font-mono text-gray-500 mt-2">
            Red = Injected Bit Flip
          </span>
        </div>
      );
    }

    function QuantumApp() {
      const [msg, setMsg] = useState("Rex tests da metal!");
      const [t1, setT1] = useState(100);
      const [time, setTime] = useState(0);
      const [qecScheme, setQecScheme] = useState("steane7");
      const [useDD, setUseDD] = useState(false);

      const [decayedText, setDecayedText] = useState(msg);
      const [bitString, setBitString] = useState("");
      const [fidelity, setFidelity] = useState(100);
      const [stats, setStats] = useState({ physicalFlips: 0, corrected: 0, failures: 0 });
      const [manualErrors, setManualErrors] = useState([]);

      const toggleError = (id) => {
        setManualErrors(prev => 
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      // Fano Syndrome Calculations
      const codeBlock = Array(7).fill(0);
      manualErrors.forEach(idx => { codeBlock[idx] = 1; });

      const s1 = (codeBlock[0] ^ codeBlock[3] ^ codeBlock[4] ^ codeBlock[6]);
      const s2 = (codeBlock[1] ^ codeBlock[3] ^ codeBlock[5] ^ codeBlock[6]);
      const s3 = (codeBlock[2] ^ codeBlock[4] ^ codeBlock[5] ^ codeBlock[6]);
      const syndromeWeight = s1 + s2 + s3;
      const syndromeInt = (s3 << 2) | (s2 << 1) | s1;
      const syndromeMap = { 1: "Q0", 2: "Q1", 4: "Q2", 3: "Q3", 5: "Q4", 6: "Q5", 7: "Q6" };
      const correctionTarget = syndromeInt in syndromeMap ? syndromeMap[syndromeInt] : "None";

      useEffect(() => {
        const effectiveT1 = useDD ? t1 * 1.8 : t1;

        if (time === 0 && manualErrors.length === 0) {
          setDecayedText(msg);
          setFidelity(100);
          setStats({ physicalFlips: 0, corrected: 0, failures: 0 });
          let initialBits = "";
          for (let c of msg) {
            initialBits += c.charCodeAt(0).toString(2).padStart(8, '0') + " ";
          }
          setBitString(initialBits.trim());
          return;
        }

        const pPhysicalError = 1 - Math.exp(-time / effectiveT1);
        
        let physicalFlipsCount = manualErrors.length;
        let correctedCount = 0;
        let failuresCount = 0;

        let resultText = "";
        let resultBits = "";
        let totalLogicalBits = msg.length * 8;
        let correctLogicalBits = 0;

        for (let char of msg) {
          let charCode = char.charCodeAt(0);
          let newByte = 0;
          let charBits = "";

          for (let bit = 7; bit >= 0; bit--) {
            let origBit = (charCode >> bit) & 1;
            let finalBit = origBit;

            if (qecScheme === "none") {
              if (Math.random() < pPhysicalError || manualErrors.length > 0) {
                finalBit = origBit === 1 ? 0 : 1;
                physicalFlipsCount++;
                failuresCount++;
              } else {
                correctLogicalBits++;
              }
            } 
            else if (qecScheme === "steane7") {
              let block = Array(7).fill(origBit);
              let errorPositions = [...manualErrors];

              for (let i = 0; i < 7; i++) {
                if (Math.random() < pPhysicalError && !errorPositions.includes(i)) {
                  errorPositions.push(i);
                  physicalFlipsCount++;
                }
              }

              errorPositions.forEach(p => { block[p] = block[p] === 1 ? 0 : 1; });

              let syn1 = (block[0] ^ block[3] ^ block[4] ^ block[6]);
              let syn2 = (block[1] ^ block[3] ^ block[5] ^ block[6]);
              let syn3 = (block[2] ^ block[4] ^ block[5] ^ block[6]);
              let synVal = (syn3 << 2) | (syn2 << 1) | syn1;

              const map = { 1: 0, 2: 1, 4: 2, 3: 3, 5: 4, 6: 5, 7: 6 };
              if (synVal in map) {
                let target = map[synVal];
                block[target] = block[target] === 1 ? 0 : 1;
              }

              let correctedOnes = block.filter(b => b === 1).length;
              finalBit = correctedOnes >= 4 ? 1 : 0;

              if (errorPositions.length === 1) {
                correctedCount++;
                correctLogicalBits++;
              } else if (errorPositions.length > 1) {
                failuresCount++;
              } else {
                correctLogicalBits++;
              }
            }

            newByte = (newByte << 1) | finalBit;
            charBits += finalBit;
          }

          resultText += String.fromCharCode(newByte);
          resultBits += charBits + " ";
        }

        setDecayedText(resultText);
        setBitString(resultBits.trim());
        setFidelity(Math.round((correctLogicalBits / totalLogicalBits) * 100));
        setStats({ physicalFlips: physicalFlipsCount, corrected: correctedCount, failures: failuresCount });

      }, [time, t1, msg, qecScheme, useDD, manualErrors]);

      return (
        <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-800 pb-4 gap-2">
            <div>
              <h1 className="text-2xl font-bold text-cyan-400">Fault-Tolerant Quantum Teleportation Lab</h1>
              <p className="text-xs text-gray-400">Interactive Steane [[7,1,3]] Fano Matrix</p>
            </div>
            <button 
              onClick={() => setManualErrors([])}
              className="text-xs font-mono bg-red-950 text-red-300 border border-red-800 px-3 py-1 rounded-full hover:bg-red-900"
            >
              Clear Manual Errors
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
            <FanoPlaneVisualizer manualErrors={manualErrors} toggleError={toggleError} />

            {/* Live Syndrome & Hamming Weight Output */}
            <div className="md:col-span-2 bg-gray-950 p-4 rounded-xl border border-gray-800 space-y-3 font-mono text-xs">
              <span className="text-cyan-400 uppercase font-bold block border-b border-gray-800 pb-1">
                Ancilla Syndrome Extraction Diagnostic
              </span>
              <div className="grid grid-cols-2 gap-2 text-gray-300">
                <div>Syndrome Vector $S$: <span className="text-cyan-300 font-bold">[{s3}, {s2}, {s1}]</span></div>
                <div>Hamming Weight $W_H(S)$: <span className="text-yellow-400 font-bold">{syndromeWeight}</span></div>
                <div>Syndrome Integer: <span className="text-cyan-300 font-bold">{syndromeInt}</span></div>
                <div>Corrective Target: <span className="text-green-400 font-bold">{correctionTarget}</span></div>
              </div>
              <p className="text-[10px] text-gray-500 pt-1">
                {syndromeWeight === 0 && "No errors detected. Logical state intact."}
                {syndromeWeight === 1 && "Single bit-flip detected on non-central qubit. Correctable."}
                {syndromeWeight === 2 && "Intersection detected. Targeted correction in progress."}
                {syndromeWeight === 3 && "Central qubit Q6 error or multi-qubit error detected."}
              </p>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-gray-950 p-4 rounded-xl border border-gray-800">
            <div className="sm:col-span-2">
              <label className="block text-xs font-mono text-gray-400 mb-2">Error Correction Architecture</label>
              <div className="grid grid-cols-2 gap-2">
                <button 
                  onClick={() => setQecScheme("none")} 
                  className={`px-3 py-2 rounded-lg text-xs font-mono border ${qecScheme === "none" ? 'bg-cyan-950 border-cyan-500 text-cyan-300' : 'bg-gray-900 border-gray-800 text-gray-400'}`}
                >
                  Unprotected
                </button>
                <button 
                  onClick={() => setQecScheme("steane7")} 
                  className={`px-3 py-2 rounded-lg text-xs font-mono border ${qecScheme === "steane7" ? 'bg-cyan-950 border-cyan-500 text-cyan-300' : 'bg-gray-900 border-gray-800 text-gray-400'}`}
                >
                  Steane [[7,1,3]] Fano
                </button>
              </div>
            </div>

            <div>
              <label className="block text-xs font-mono text-gray-400 mb-2">Dynamical Decoupling</label>
              <button 
                onClick={() => setUseDD(!useDD)} 
                className={`w-full py-2 rounded-lg text-xs font-mono font-bold border ${useDD ? 'bg-indigo-950 border-indigo-500 text-indigo-300' : 'bg-gray-900 border-gray-800 text-gray-400'}`}
              >
                {useDD ? 'XY4 ACTIVE' : 'DD OFF'}
              </button>
            </div>
          </div>

          <div className="bg-gray-950 p-5 rounded-xl border border-gray-800 space-y-4">
            <div className="flex justify-between items-center text-xs font-mono text-gray-400">
              <span>TELEPORTED READOUT (FutureRex)</span>
              <span className={`font-bold ${fidelity > 80 ? 'text-green-400' : fidelity > 40 ? 'text-yellow-400' : 'text-red-400'}`}>
                Fidelity: {fidelity}%
              </span>
            </div>
            <div className="text-2xl font-mono text-cyan-300 tracking-wide break-all bg-black/40 p-3 rounded-lg border border-gray-900">
              {decayedText}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<QuantumApp/>);
  </script>
</body>
</html>
